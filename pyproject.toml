[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-claims-streaming"
version = "0.1.0"
description = "Insurance claim events: Kafka -> Python consumer -> PostgreSQL, with a FastAPI read API and Prometheus metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "confluent-kafka>=2.5",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Kafka and PostgreSQL (see docker-compose.yml)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
